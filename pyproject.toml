[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-retrofit"
version = "0.2.0"
description = "Post-training concept bottlenecks for pretrained autoregressive language models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=5.0,<6", "datasets>=3,<5", "huggingface-hub>=0.25", "numpy>=1.24", "scikit-learn>=1.3", "peft>=0.14", "accelerate>=1.0"]

[tool.setuptools.packages.find]
include = ["concept_retrofit*"]
