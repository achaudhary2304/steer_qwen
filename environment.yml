name: concept-retrofit
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.4
  - numpy>=1.24
  - scikit-learn>=1.3
  - pip:
      - transformers>=5.0,<6
      - datasets>=3,<5
      - huggingface-hub>=0.25
      - peft>=0.14
      - accelerate>=1.0
      - -e .
